<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <title>SGT 8º BAEP - v7.4 (Supabase)</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;600;800&display=swap');

    :root {
      --bg-body: #050505;
      --primary: #f1f10e;
      --accent: #8c6a36;
      --danger: #ff4d4d;
      --success: #00ff6a;
      --text-main: #e0e0e0;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at top center, #1a1a1a 0%, var(--bg-body) 100%);
      color: var(--text-main);
      margin: 0;
      padding-bottom: 30px;
    }

    #notification-container {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 10001;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notification {
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      animation: slideIn 0.3s ease forwards;
      backdrop-filter: blur(10px);
    }

    @keyframes slideIn {
      from {
        transform: translateX(120%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .topbar {
      background: rgba(0, 0, 0, 0.95);
      border-bottom: 2px solid var(--accent);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topbar h1 {
      font-family: 'Cinzel', serif;
      margin: 0;
      color: var(--primary);
      letter-spacing: 2px;
      font-size: 1.5rem;
    }

    .container {
      max-width: 1600px;
      margin: 15px auto;
      padding: 0 20px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .stat-card h4 {
      margin: 0;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #888;
    }

    .stat-card .value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      font-family: 'Cinzel', serif;
      margin-top: 5px;
    }

    .card {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .btn-gold {
      background: linear-gradient(45deg, var(--accent), #d4af37);
      color: #000;
      width: 100%;
      margin-top: 15px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      padding: 15px;
      border-radius: 6px;
      text-transform: uppercase;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .btn-gold.editing-mode {
      background: linear-gradient(45deg, #1a3a5a, #2a5a8a);
      color: #fff;
      border: 1px solid #4a8ada;
    }

    .search-box {
      background: #1a1a1a;
      border: 1px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      background: transparent;
      border: none;
      font-size: 1rem;
      color: #fff;
      outline: none;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td {
      padding: 15px 10px;
      border-bottom: 1px solid #222;
      font-size: 0.95rem;
      vertical-align: top;
      word-wrap: break-word;
      transition: 0.2s;
    }

    .status-pri-group {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .status-pri-group select {
      padding: 8px 4px;
      font-size: 0.75rem;
      flex: 1;
    }

    .action-row {
      display: flex;
      gap: 5px;
    }

    .btn-sm {
      flex: 1;
      padding: 10px 5px;
      border: none;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      color: white;
      transition: 0.2s;
    }

    .btn-edit { background: #1a3a5a; }
    .btn-wa { background: #128C7E; }
    .btn-del { background: var(--danger); }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      display: inline-block;
      margin-bottom: 5px;
    }

    .bg-prof {
      background: rgba(140, 106, 54, 0.2);
      color: #d4af37;
      border: 1px solid #d4af37;
    }

    textarea {
      height: 100px;
    }

    .pri-ALTA { color: var(--danger) !important; font-weight: 800; }
    .pri-MEDIA { color: var(--primary) !important; font-weight: 800; }

    .grid-form {
      display: grid;
      gap: 15px;
      grid-template-columns: repeat(4, 1fr);
    }

    .missao-full {
      grid-column: span 2;
    }

    @media(max-width:1024px){
      .grid-form{
        grid-template-columns:1fr 1fr;
      }

      .missao-full{
        grid-column:1/-1;
      }

      table, thead, tbody, th, td, tr{
        display:block;
      }

      th{
        display:none;
      }

      tr{
        background:#0a0a0a;
        border:1px solid var(--border);
        border-radius:10px;
        margin-bottom:15px;
        padding:12px;
      }
    }
  </style>
</head>

<body>

<div id="notification-container"></div>

<div class="topbar">
  <h1>SGT - 8º BAEP</h1>
  <small style="color:var(--success)">Sincronização Supabase Ativa 🟢 v7.4</small>
</div>

<div class="container">

  <div class="dashboard">
    <div class="stat-card">
      <h4>Total</h4>
      <div class="value" id="stat-total">0</div>
    </div>

    <div class="stat-card" style="border-left-color:var(--danger)">
      <h4 style="color:var(--danger)">Atrasadas</h4>
      <div class="value" id="stat-atrasada" style="color:var(--danger)">0</div>
    </div>

    <div class="stat-card">
      <h4>Feedback</h4>
      <div class="value" id="stat-feedback" style="color:#00c3ff">0</div>
    </div>
  </div>

  <div class="card">

    <h3 style="margin:0 0 15px 0;color:var(--primary);font-family:'Cinzel';">
      Lançar Ordem de Missão
    </h3>

    <div class="grid-form">

      <div>
        <label>Categoria</label>
        <select id="task-category" onchange="toggleFields()">
          <option value="PROFISSIONAL">BAEP</option>
          <option value="PESSOAL">PESSOAL</option>
        </select>
      </div>

      <div>
        <label>Seção</label>
        <select id="task-secao">
          <option value="NENHUMA">---</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
          <option value="P3">P3</option>
          <option value="P4">P4</option>
          <option value="P5">P5</option>
          <option value="SJD">SJD</option>
        </select>
      </div>

      <div>
        <label>Prioridade</label>
        <select id="task-prioridade">
          <option value="ALTA">🔴 ALTA</option>
          <option value="MEDIA" selected>🟡 MÉDIA</option>
          <option value="BAIXA">🟢 BAIXA</option>
        </select>
      </div>

      <div>
        <label>Demanda passada por superior?</label>
        <select id="task-tem-superior" onchange="toggleFields()">
          <option value="NAO">Não</option>
          <option value="SIM">Sim</option>
        </select>
      </div>

      <div id="div-superior" style="display:none">
        <label>Nome do Superior</label>
        <input type="text" id="task-superior" placeholder="Ex: Ten Cel PM Senise">
      </div>

      <div class="missao-full">
        <label>Missão</label>
        <input type="text" id="task-desc" placeholder="Descreva a missão operacional...">
      </div>

      <div>
        <label>Executor</label>
        <input type="text" id="task-executor">
      </div>

      <div>
        <label>Prazo Final</label>
        <input type="date" id="task-deadline">
      </div>

      <div id="div-feedback" style="display:none">
        <label>Exige Retorno?</label>
        <select id="task-exige-feedback">
          <option value="NAO">Não</option>
          <option value="SIM">Sim</option>
        </select>
      </div>

    </div>

    <button id="btn-main-action" class="btn-gold" onclick="addOrUpdateTask()">
      Sincronizar Missão na Nuvem
    </button>

  </div>

  <div class="card">

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Filtrar responsável ou missão..." onkeyup="render()">
    </div>

    <div style="overflow-x:auto">

      <table>

        <thead>
          <tr>
            <th>Status</th>
            <th>Missão</th>
            <th>Prazo</th>
            <th>Anotações</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="task-list"></tbody>

      </table>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = 'https://oxwnbjmjpxvjtfvzkdju.supabase.co';
const supabaseKey = 'sb_publishable_oMN5FVGpCwdlllqynA1IpA_paDrG1fk';

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let tasks = [];
let currentEditId = null;

function showNotify(msg, type='success'){

  const container = document.getElementById('notification-container');

  const toast = document.createElement('div');

  toast.className = `notification ${type}`;

  toast.innerHTML = `<span>${type==='success'?'✅':'⚠️'}</span> ${msg}`;

  container.appendChild(toast);

  setTimeout(()=>{
    toast.style.opacity='0';
    setTimeout(()=>toast.remove(),500);
  },3000);
}

function formatDataBR(iso){

  if(!iso) return "---";

  const [a,m,d] = iso.split('-');

  return `${d}/${m}/${a}`;
}

async function fetchTasks(){

  const {data,error} = await supabase
    .from('tarefas')
    .select('*');

  if(error){
    console.error(error);
    return;
  }

  tasks = data || [];

  updateStats();

  render();
}

supabase.channel('custom-all-channel')
.on('postgres_changes',
{
  event:'*',
  schema:'public',
  table:'tarefas'
},
(payload)=>{
  fetchTasks();
})
.subscribe();

fetchTasks();

function updateStats(){

  const now = new Date().toISOString().split('T')[0];

  document.getElementById('stat-total').innerText = tasks.length;

  document.getElementById('stat-atrasada').innerText =
    tasks.filter(t=>t.end < now).length;

  document.getElementById('stat-feedback').innerText =
    tasks.filter(t=>t.exigeFeedbackSup==='SIM' && t.statusFeedbackSup==='NAO').length;
}

function toggleFields(){

  var cat = document.getElementById('task-category').value;

  document.getElementById('task-secao').disabled = (cat === 'PESSOAL');

  var sup = document.getElementById('task-tem-superior').value;

  var divF = document.getElementById('div-feedback');

  var divS = document.getElementById('div-superior');

  if(sup === 'SIM'){

    divF.style.display = 'block';

    divS.style.display = 'block';

  } else {

    divF.style.display = 'none';

    divS.style.display = 'none';

    document.getElementById('task-superior').value = '';
  }
}

async function addOrUpdateTask(){

  const desc = document.getElementById('task-desc').value;

  const end = document.getElementById('task-deadline').value;

  if(!desc || !end){

    showNotify("Missão e Prazo obrigatórios!", "error");

    return;
  }

  const payload = {

    category: document.getElementById('task-category').value,

    secao: document.getElementById('task-secao').value,

    prioridade: document.getElementById('task-prioridade').value,

    temSuperior: document.getElementById('task-tem-superior').value,

    superior: document.getElementById('task-superior').value || 'N/A',

    exigeFeedbackSup: document.getElementById('task-exige-feedback').value,

    desc: desc,

    executor: document.getElementById('task-executor').value || 'Cap Romão',

    end: end,

    statusFeedbackSup: 'NAO'
  };

  if(currentEditId){

    const {error} = await supabase
      .from('tarefas')
      .update(payload)
      .eq('id', currentEditId);

    if(error){

      console.error(error);

      showNotify("Erro ao atualizar","error");

    } else {

      showNotify("Alterações salvas");

      resetForm();
    }

  } else {

    payload.id = crypto.randomUUID();

    payload.start = new Date().toISOString().split('T')[0];

    payload.status = 'PENDENTE';

    payload.feedback = '';

    payload.createdAt = new Date().toISOString();

    const {error} = await supabase
      .from('tarefas')
      .insert([payload]);

    if(error){

      console.error(error);

      showNotify("Erro ao inserir","error");

    } else {

      showNotify("Missão sincronizada");

      resetForm();
    }
  }
}

function resetForm(){

  document.getElementById('task-desc').value = '';

  document.getElementById('task-superior').value = '';

  document.getElementById('task-tem-superior').value = 'NAO';

  currentEditId = null;

  toggleFields();
}

async function updateTaskField(id,field,value){

  if(field === 'status' && value === 'CONCLUIDO'){

    const {error} = await supabase
      .from('tarefas')
      .delete()
      .eq('id', id);

    if(!error){

      showNotify("Missão concluída");
    }

  } else {

    const {error} = await supabase
      .from('tarefas')
      .update({[field]:value})
      .eq('id', id);

    if(!error){

      showNotify("Atualizado");
    }
  }
}

async function deleteTask(id){

  if(confirm('Excluir missão?')){

    const {error} = await supabase
      .from('tarefas')
      .delete()
      .eq('id', id);

    if(!error){

      showNotify("Missão excluída");
    }
  }
}

function prepareEdit(id){

  const t = tasks.find(x=>x.id===id);

  if(!t) return;

  document.getElementById('task-category').value = t.category || 'PROFISSIONAL';

  document.getElementById('task-secao').value = t.secao || 'NENHUMA';

  document.getElementById('task-prioridade').value = t.prioridade || 'MEDIA';

  document.getElementById('task-tem-superior').value = t.temSuperior || 'NAO';

  document.getElementById('task-superior').value = t.superior || '';

  document.getElementById('task-desc').value = t.desc;

  document.getElementById('task-executor').value = t.executor;

  document.getElementById('task-deadline').value = t.end;

  toggleFields();

  currentEditId = id;

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  showNotify("Modo edição");
}

function render(){

  const list = document.getElementById('task-list');

  const search = document.getElementById('search-input').value.toLowerCase();

  const now = new Date().toISOString().split('T')[0];

  list.innerHTML = '';

  let filtered = tasks.filter(t =>
    t.desc.toLowerCase().includes(search) ||
    t.executor.toLowerCase().includes(search)
  );

  filtered.forEach(t=>{

    const isAtrasada = t.end < now;

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>

        <div class="status-pri-group">

          <select onchange="updateTaskField('${t.id}','status',this.value)">
            <option value="PENDENTE">⏳ PENDENTE</option>
            <option value="CONCLUIDO">✅ CONCLUÍDO</option>
          </select>

          <select onchange="updateTaskField('${t.id}','prioridade',this.value)" class="pri-${t.prioridade}">

            <option value="ALTA" ${t.prioridade==='ALTA'?'selected':''}>🔴 ALTA</option>

            <option value="MEDIA" ${t.prioridade==='MEDIA'?'selected':''}>🟡 MÉDIA</option>

            <option value="BAIXA" ${t.prioridade==='BAIXA'?'selected':''}>🟢 BAIXA</option>

          </select>

        </div>

      </td>

      <td>

        <span class="badge bg-prof">${t.secao}</span>

        <div style="font-weight:800;color:#fff;margin:4px 0;font-size:1.05rem;">
          ${t.desc}
        </div>

        <div style="font-size:0.75rem;color:var(--primary);font-weight:600;">
          Responsável: ${t.executor}
        </div>

        ${t.temSuperior === 'SIM' ? `
          <div style="font-size:0.75rem;color:#00c3ff;font-weight:600;">
            Superior: ${t.superior}
          </div>
        ` : ''}

      </td>

      <td style="color:${isAtrasada?'var(--danger)':'#fff'};font-weight:800;">
        ${formatDataBR(t.end)}
      </td>

      <td>
        <textarea onchange="updateTaskField('${t.id}','feedback',this.value)">${t.feedback || ''}</textarea>
      </td>

      <td>

        <div class="action-row">

          <button class="btn-sm btn-edit" onclick="prepareEdit('${t.id}')">
            EDIT
          </button>

          <button class="btn-sm btn-del" onclick="deleteTask('${t.id}')">
            DEL
          </button>

        </div>

      </td>
    `;

    list.appendChild(tr);
  });
}

window.addEventListener('DOMContentLoaded', toggleFields);

</script>

</body>
</html>
