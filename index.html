<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="application-name" content="Gestão Eficaz" />
  <meta name="msapplication-TileColor" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gestão Eficaz" />
  <meta name="description" content="Sistema de Gestão de Missões." />

  <title>Gestão Eficaz</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./assets/icon-512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <h1>Gestão Eficaz</h1>
      <p class="auth-subtitle">Acesso restrito · entre com seu e-mail e senha</p>

      <form id="auth-form" autocomplete="on">
        <div>
          <label for="auth-email">E-mail</label>
          <input type="email" id="auth-email" required autocomplete="username" placeholder="seu@email.com" />
        </div>
        <div>
          <label for="auth-password">Senha</label>
          <div class="password-field">
            <input type="password" id="auth-password" required autocomplete="current-password" minlength="6" placeholder="••••••••" />
            <button type="button" class="btn-toggle-password" id="btn-toggle-password" aria-label="Mostrar senha" title="Mostrar senha">
              <span id="toggle-password-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <button type="submit" class="btn-gold" id="auth-submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="app-shell" hidden>
    <div class="topbar">
      <button type="button" class="btn-sair" id="btn-sair" title="Encerrar sessão" aria-label="Sair">
        Sair
      </button>
      <h1>Gestão Eficaz</h1>
      <small id="connection-status" class="status-loading">Sincronizando…</small>
    </div>

    <div class="container">
      <div class="install-banner" id="install-banner">
        <div class="text">
          <strong>Instalar aplicativo</strong>
          <small>Adicione o sistema na tela inicial para abrir em tela cheia.</small>
        </div>
        <div class="install-actions">
          <button type="button" class="btn-install" id="install-btn">Instalar</button>
          <button type="button" class="btn-dismiss" id="dismiss-install-btn">Agora não</button>
        </div>
      </div>

      <div id="offline-banner" class="offline-banner" hidden>
        Você está offline. É possível consultar o cache; salvar exige conexão.
      </div>

      <form id="mission-form" class="capture-form" autocomplete="off">
        <div class="field-group capture-title-row">
          <label for="task-descricao">Descrição da missão</label>
          <textarea
            id="task-descricao"
            class="capture-input capture-textarea"
            placeholder="O que precisa ser feito?"
            maxlength="500"
            rows="2"
            required
            autofocus
          ></textarea>
        </div>

        <div class="capture-options" id="capture-options">
          <div class="field-group">
            <span class="field-label">Tipo de missão</span>
            <div class="chip-row" data-chip-group="tipo" role="group" aria-label="Tipo de missão">
              <button type="button" class="chip chip-pro is-active" data-value="PROFISSIONAL">Profissional</button>
              <button type="button" class="chip chip-pes" data-value="PESSOAL">Pessoal</button>
            </div>
          </div>

          <div class="field-group" id="field-secao">
            <span class="field-label">Seção</span>
            <div class="chip-row" data-chip-group="secao" role="group" aria-label="Seção">
              <button type="button" class="chip is-active" data-value="NENHUMA">---</button>
              <button type="button" class="chip" data-value="P1">P1</button>
              <button type="button" class="chip" data-value="P2">P2</button>
              <button type="button" class="chip" data-value="P3">P3</button>
              <button type="button" class="chip" data-value="P4">P4</button>
              <button type="button" class="chip" data-value="P5">P5</button>
              <button type="button" class="chip" data-value="SJD">SJD</button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="task-deadline">Prazo</label>
            <input type="date" id="task-deadline" class="date-input" />
          </div>
        </div>

        <div class="capture-actions">
          <button type="submit" class="btn-gold btn-capture" id="btn-save">Salvar</button>
        </div>
      </form>

      <section class="mission-board" aria-label="Missões ativas">
        <div class="board-header">
          <h2>Foco</h2>
          <p id="list-meta" class="list-meta" aria-live="polite"></p>
        </div>

        <ul id="task-list" class="mission-list"></ul>
      </section>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <script src="./app.js" defer></script>
</body>

</html>
