<style>

  :root{

    --bg-body:#030303;
    --bg-card:#0b0b0b;
    --bg-secondary:#101010;

    --primary:#d6b34b;
    --primary-strong:#f1d97a;

    --accent:#8c6a36;

    --danger:#ff4d4d;

    --success:#00ff88;

    --text-main:#f2f2f2;

    --border:#252525;

    --shadow:
      0 0 10px rgba(214,179,75,.15),
      0 0 25px rgba(214,179,75,.05);

    --military-gradient:
      linear-gradient(
        135deg,
        #050505 0%,
        #101010 40%,
        #161616 100%
      );
  }

  body{

    background:
      radial-gradient(
        circle at top center,
        #1d1d1d 0%,
        #050505 100%
      );

    color:var(--text-main);
  }

  .card{

    background:var(--military-gradient);

    border:1px solid #2e2e2e;

    box-shadow:var(--shadow);

    backdrop-filter:blur(6px);
  }

  .topbar{

    background:
      linear-gradient(
        90deg,
        #050505 0%,
        #111111 50%,
        #050505 100%
      );

    border-bottom:2px solid var(--primary);
  }

  .topbar h1{

    color:var(--primary-strong);

    text-shadow:
      0 0 10px rgba(214,179,75,.5);
  }

  input,
  select,
  textarea{

    background:#050505;

    border:1px solid #2f2f2f;

    transition:.2s ease;
  }

  input:focus,
  select:focus,
  textarea:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
      0 0 8px rgba(214,179,75,.25);
  }

  .btn-gold{

    background:
      linear-gradient(
        45deg,
        #8c6a36,
        #d4af37,
        #f1d97a
      );

    color:#000;

    transition:.25s ease;
  }

  .btn-gold:hover{

    transform:translateY(-2px);

    box-shadow:
      0 0 12px rgba(214,179,75,.4);
  }

  .btn-sm{

    transition:.2s ease;
  }

  .btn-sm:hover{

    transform:translateY(-1px);

    filter:brightness(1.1);
  }

  .dashboard .stat-card{

    background:
      linear-gradient(
        180deg,
        #0f0f0f,
        #070707
      );

    box-shadow:var(--shadow);
  }

  .dashboard .stat-card:hover{

    border-color:var(--primary);

    transform:translateY(-3px);
  }

  table tr:hover{

    background:
      rgba(214,179,75,.03);
  }

  .badge{

    background:
      rgba(214,179,75,.15);

    border:1px solid rgba(214,179,75,.35);

    color:var(--primary-strong);
  }

  /* ========================= */
  /* BOTÃO CALENDÁRIO VISÍVEL */
  /* ========================= */

  input[type="date"]{

    position:relative;

    color:#fff;

    cursor:pointer;
  }

  input[type="date"]::-webkit-calendar-picker-indicator{

    opacity:1;

    filter:
      invert(80%)
      sepia(40%)
      saturate(500%)
      hue-rotate(5deg);

    cursor:pointer;

    width:22px;
    height:22px;
  }

  /* ========================= */
  /* BOTÃO WHATSAPP FLUTUANTE */
  /* ========================= */

  .floating-wa{

    position:fixed;

    bottom:25px;

    right:25px;

    width:65px;

    height:65px;

    border-radius:50%;

    background:#25D366;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:2rem;

    color:white;

    cursor:pointer;

    z-index:99999;

    box-shadow:
      0 0 20px rgba(37,211,102,.5);

    transition:.2s ease;
  }

  .floating-wa:hover{

    transform:scale(1.08);
  }

  /* ========================= */
  /* NOTIFICAÇÕES MILITARES */
  /* ========================= */

  .notification{

    background:
      linear-gradient(
        135deg,
        #0b0b0b,
        #181818
      );

    border-left:5px solid var(--primary);

    box-shadow:
      0 0 15px rgba(214,179,75,.15);

    color:#fff;
  }

</style>

<!-- ========================================= -->
<!-- BOTÃO FLUTUANTE WHATSAPP -->
<!-- ========================================= -->

<div
  class="floating-wa"
  onclick="sendGeneralWhatsApp()"
  title="Enviar relatório geral via WhatsApp"
>
  📲
</div>

<script>

  // =========================================
  // RELATÓRIO GERAL WHATSAPP
  // =========================================

  function sendGeneralWhatsApp(){

    if(tasks.length === 0){

      showNotify('Nenhuma missão cadastrada');

      return;
    }

    let mensagem =
      `🚨 *SGT - 8º BAEP*\n` +
      `📋 *RELATÓRIO OPERACIONAL DE MISSÕES*\n\n`;

    tasks.forEach((t,index)=>{

      mensagem +=
        `----------------------------------\n` +

        `🎯 *MISSÃO ${index + 1}*\n\n` +

        `📌 Missão: ${t.descricao}\n` +

        `👤 Executor: ${t.executor}\n` +

        `🏢 Seção: ${t.secao}\n` +

        `⚡ Prioridade: ${t.prioridade}\n` +

        `📅 Prazo: ${formatDataBR(t.end)}\n` +

        `${t.temSuperior === 'SIM'
          ? `👮 Superior: ${t.superior}\n`
          : ''
        }` +

        `📊 Status: ${t.status}\n\n`;
    });

    const url =
      `https://wa.me/?text=${encodeURIComponent(mensagem)}`;

    window.open(url,'_blank');
  }

  // =========================================
  // NOTIFICAÇÕES AUTOMÁTICAS WHATSAPP
  // =========================================

  async function sendAutoWhatsApp(payload){

    try{

      const mensagem =
        `🚨 *NOVA MISSÃO CADASTRADA*\n\n` +

        `📌 ${payload.descricao}\n\n` +

        `👤 Executor: ${payload.executor}\n` +

        `🏢 Seção: ${payload.secao}\n` +

        `⚡ Prioridade: ${payload.prioridade}\n` +

        `📅 Prazo: ${formatDataBR(payload.end)}\n` +

        `${payload.temSuperior === 'SIM'
          ? `👮 Superior: ${payload.superior}\n`
          : ''
        }`;

      const url =
        `https://wa.me/?text=${encodeURIComponent(mensagem)}`;

      window.open(url,'_blank');

    } catch(e){

      console.error(e);
    }
  }

</script>
